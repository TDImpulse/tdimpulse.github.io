<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
    <title>Страница не найдена | ТД Импульс</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-6">
    
    <div class="max-w-md w-full text-center bg-black/40 backdrop-blur-md border border-white/10 p-10 rounded-3xl">
        <h1 class="text-6xl font-extrabold text-blue-500 mb-4">404</h1>
        <h2 class="text-2xl font-bold mb-4">Страница не найдена</h2>
        <p class="text-gray-400 mb-8">Кажется, вы перешли по неверной ссылке. Но не переживайте, мы поможем вам вернуться!</p>
        
        <div class="flex flex-col gap-3">
            <a href="index.html" class="w-full py-3 bg-blue-900 rounded-full font-bold hover:bg-blue-800 transition">На главную</a>
            <a href="catalog.html" class="w-full py-3 bg-white/10 rounded-full font-bold hover:bg-white/20 transition">Перейти в каталог</a>
        </div>
        
        
    </div>

<script>
        document.addEventListener("DOMContentLoaded", () => {
            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxMZR4b8JjQ_T8ACzViz1oSlvqvUUJD4IuB8KvjmRA7nTxIkTHMmlHqsT6I1U0kKX7-ng/exec';

            const page = window.location.pathname.split('/').pop() || 'index.html';
            const source = document.referrer 
                ? new URL(document.referrer).hostname 
                : 'direct';

            let sessionId = sessionStorage.getItem('anon_session');
            if (!sessionId) {
                sessionId = Math.random().toString(36).substring(2, 9) + '-' + Date.now();
                sessionStorage.setItem('anon_session', sessionId);
            }

            const logData = {session_id: sessionId,source: source, page: page, button: "۰ 404 Ошибка",
			time: new Date().toISOString()};
            fetch(WEB_APP_URL, {method: 'POST', mode: 'no-cors', body: JSON.stringify(logData)});
        });
</script>

	
	
	
</body>
</html>
