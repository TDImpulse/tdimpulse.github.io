name: CRM & Pages Deploy

on:
  push:
    paths:
      - 'prices.json'
      - '.github/workflows/**'
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Запуск скрипта обновления цен
        run: node update-prices.js

      - name: Авто-коммит и пуш обновленных HTML-файлов
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *_TEST.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: обновление цен в тестовых HTML [skip ci]" && git push)

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузка артефакта сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
